name: Oxide
options:
  bundleIdPrefix: com.ulfschnabel
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OxideKit:
    path: Packages/OxideKit
settings:
  base:
    DEVELOPMENT_TEAM: X632M62W9H
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "17"
targets:
  Oxide:
    type: application
    platform: iOS
    sources: [Oxide]
    dependencies:
      - package: OxideKit
    info:
      path: Oxide/Info.plist
      properties:
        CFBundleDisplayName: Oxide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Mouse and trackpad as pointer touches, every button with its mask.
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          # Sessions in windows of their own: tabs on a Mac, side by side on an iPad.
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Oxide connects to computers on your network to control them remotely.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: Oxide/Oxide.entitlements
      properties:
        # The saved computers sync through iCloud's key-value store.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ulfschnabel.duodesk
        TARGETED_DEVICE_FAMILY: "1,2,6"
        # A Mac app too (Mac Catalyst), under the same bundle ID: the same App
        # Store record, the same iCloud data.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # On a Mac the App Store wants the sandbox (with outgoing connections).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Oxide/Oxide-mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          # The Mac release build is signed for the App Store directly:
          # automatic development signing would need a registered Mac.
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": com.ulfschnabel.duodesk MacAppStore
